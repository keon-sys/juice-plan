<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('초기 비밀번호 설정')}"></head>
<body class="auth-page">
<div class="card auth-card">
    <h1 style="margin:0 0 4px;">최초 비밀번호 설정</h1>
    <p class="muted" style="margin:0 0 16px;">이 여행 계획에 접근할 비밀번호를 정해주세요.</p>

    <p th:if="${error}" th:text="${error}" class="error" style="margin:0 0 8px;"></p>

    <form method="post" th:action="@{/setup}">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required autofocus>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" required>

        <button type="submit" class="btn btn--primary btn--block" style="margin-top:16px;">설정</button>
    </form>
</div>
</body>
</html>
