server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/juice-plan;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}
