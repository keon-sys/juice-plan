<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <!-- viewport-fit=cover 가 있어야 env(safe-area-inset-*) 가 동작한다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title}">juice-plan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<footer th:fragment="tabs(active)">
    <nav>
        <a href="/sources" th:classappend="${active == 'sources'} ? 'active' : ''">
            <span aria-hidden="true">📋</span><span>소스 관리</span>
        </a>
        <a href="/plan" th:classappend="${active == 'plan'} ? 'active' : ''">
            <span aria-hidden="true">🗓️</span><span>일자별 동선</span>
        </a>
        <a href="/day" th:classappend="${active == 'day'} ? 'active' : ''">
            <span aria-hidden="true">🧭</span><span>계획 보기</span>
        </a>
    </nav>
</footer>
</body>
</html>
