<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('소스 관리')}"></head>
<body>
<h1>소스 관리</h1>

<p th:if="${error}" th:text="${error}" class="error"></p>

<section class="card" id="trip-widget">
    <div th:if="${trip == null}">
        <p class="muted" style="margin:0 0 8px;">먼저 여행 기간을 설정해주세요.</p>
        <form method="post" th:action="@{/trip}">
            <label for="tripStart">시작일</label>
            <input type="date" id="tripStart" name="startDate" required>
            <label for="tripEnd">종료일</label>
            <input type="date" id="tripEnd" name="endDate" required>
            <button type="submit" class="btn btn--primary btn--block" style="margin-top:16px;">여행 기간 설정</button>
        </form>
    </div>
    <div th:if="${trip != null}">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <div>
                <div class="muted">여행 기간</div>
                <strong th:text="${trip.startDate} + ' ~ ' + ${trip.endDate}">기간</strong>
            </div>
            <button type="button" class="btn btn--ghost" id="tripEditBtn">수정</button>
        </div>
        <form id="trip-edit" method="post" th:action="@{/trip}" style="display:none;">
            <label for="tripStartEdit">시작일</label>
            <input type="date" id="tripStartEdit" name="startDate" th:value="${trip.startDate}" required>
            <label for="tripEndEdit">종료일</label>
            <input type="date" id="tripEndEdit" name="endDate" th:value="${trip.endDate}" required>
            <button type="submit" class="btn btn--primary btn--block" style="margin-top:16px;">저장</button>
        </form>
    </div>
</section>

<div class="chip-row">
    <button type="button" class="chip chip--on" data-filter="all">전체</button>
    <button type="button" class="chip" data-filter="RESTAURANT">🍴 음식점</button>
    <button type="button" class="chip" data-filter="ATTRACTION">📍 관광지</button>
    <button type="button" class="chip" data-filter="unassigned">미배정</button>
</div>

<section id="source-list">
    <p th:if="${#lists.isEmpty(sources)}" class="card muted">
        아직 등록한 소스가 없습니다. 오른쪽 아래 + 버튼으로 추가해주세요.
    </p>

    <ul style="list-style:none; padding:0; margin:0;">
        <li th:each="s : ${sources}" class="card source-card"
            th:attr="data-place-type=${s.placeType}, data-scheduled=${s.scheduledDate != null}">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span th:if="${s.placeType.name() == 'RESTAURANT'}" class="badge badge--food">🍴 음식점</span>
                <span th:unless="${s.placeType.name() == 'RESTAURANT'}" class="badge badge--attraction">📍 관광지</span>
                <strong th:text="${s.name}">이름</strong>
            </div>

            <div class="muted" style="margin-top:4px;">
                <span th:text="${s.durationMinutes} + '분'">60분</span> ·
                <span th:if="${s.scheduledDate != null}"
                      th:text="${s.scheduledDate} + ' ' +
                               ${#numbers.formatInteger((s.startMinutes % 1440) / 60, 2)} + ':' +
                               ${#numbers.formatInteger(s.startMinutes % 60, 2)}">2026-08-15 11:00</span>
                <span th:if="${s.scheduledDate == null}">미배정</span>
            </div>

            <div th:if="${s.reservationRequired}" class="badge badge--reservation" style="margin-top:8px;"
                 th:text="'🔔 예약 마감 ' + ${s.reservationDeadline}">🔔 예약 마감</div>

            <p th:if="${s.memo != null}" th:text="${s.memo}" class="muted"
               style="white-space:pre-wrap; margin:8px 0 0;"></p>

            <div style="display:flex; gap:8px; margin-top:12px;">
                <button type="button" class="btn edit-btn"
                        th:attr="data-id=${s.id},
                                 data-google-maps-url=${s.googleMapsUrl},
                                 data-name=${s.name},
                                 data-latitude=${s.latitude},
                                 data-longitude=${s.longitude},
                                 data-place-type=${s.placeType},
                                 data-duration-hours=${s.durationMinutes / 60},
                                 data-duration-minutes-part=${s.durationMinutes % 60},
                                 data-reservation-required=${s.reservationRequired},
                                 data-reservation-deadline=${s.reservationDeadline},
                                 data-memo=${s.memo}">수정</button>
                <button type="button" class="btn btn--danger delete-btn" th:attr="data-id=${s.id}">삭제</button>
            </div>
        </li>
    </ul>
</section>

<button type="button" class="fab" id="addSourceBtn" aria-label="소스 추가">+</button>

<div class="sheet__backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sourceSheet">
    <h3 id="sheetTitle">새 소스 추가</h3>

    <form method="post" th:action="@{/sources}" id="sourceForm">
        <label for="googleMapsUrl">구글맵 공유 링크</label>
        <div style="display:flex; gap:8px;">
            <input type="text" id="googleMapsUrl" name="googleMapsUrl" required>
            <button type="button" class="btn" id="parseLinkBtn" style="white-space:nowrap;">가져오기</button>
        </div>
        <p id="parseError" class="error" style="display:none; margin:8px 0 0;"></p>

        <label for="name">이름</label>
        <input type="text" id="name" name="name" required>

        <div style="display:flex; gap:8px;">
            <div style="flex:1;">
                <label for="latitude">위도</label>
                <input type="number" step="any" id="latitude" name="latitude" required>
            </div>
            <div style="flex:1;">
                <label for="longitude">경도</label>
                <input type="number" step="any" id="longitude" name="longitude" required>
            </div>
        </div>

        <fieldset>
            <legend>장소 종류</legend>
            <label class="inline"><input type="radio" name="placeType" value="RESTAURANT" required> 🍴 음식점</label>
            <label class="inline"><input type="radio" name="placeType" value="ATTRACTION"> 📍 관광지</label>
        </fieldset>

        <label>예상 소요 시간</label>
        <div style="display:flex; gap:8px; align-items:center;">
            <input type="number" min="0" name="durationHours" value="0" aria-label="시간"> 시간
            <input type="number" min="0" max="59" name="durationMinutesPart" value="0" aria-label="분"> 분
        </div>

        <label class="inline" style="margin-top:16px;">
            <input type="checkbox" id="reservationRequired" name="reservationRequired" value="true"> 예약 필요
        </label>
        <div id="reservationDeadlineWrap" style="display:none;">
            <label for="reservationDeadline">예약 마감일</label>
            <input type="date" id="reservationDeadline" name="reservationDeadline">
        </div>

        <label for="memo">비고</label>
        <textarea id="memo" name="memo" rows="2" placeholder="예: 창가 자리 요청, 현금만 가능"></textarea>

        <button type="submit" class="btn btn--primary btn--block" style="margin-top:16px;">저장</button>
        <button type="button" class="btn btn--ghost btn--block" id="sheetClose" style="margin-top:8px;">닫기</button>
    </form>
</div>

<div th:replace="~{fragments/layout :: tabs('sources')}"></div>

<script th:src="@{/js/sources.js}"></script>
</body>
</html>
