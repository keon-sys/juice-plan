<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 입력')}"></head>
<body class="auth-page">
<div class="card auth-card">
    <h1 style="margin:0 0 4px;">juice-plan</h1>
    <p class="muted" style="margin:0 0 16px;">비밀번호를 입력해주세요.</p>

    <p th:if="${error}" th:text="${error}" class="error" style="margin:0 0 8px;"></p>

    <form method="post" th:action="@{/login}">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required autofocus>
        <button type="submit" class="btn btn--primary btn--block" style="margin-top:16px;">입장</button>
    </form>
</div>
</body>
</html>
