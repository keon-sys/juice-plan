<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>juice-plan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="auth-page">
    <form class="auth-card" method="post" th:action="@{/password}">
        <h1 class="auth-title">juice-plan</h1>

        <input type="hidden" name="next" th:value="${next}">

        <label class="auth-label" for="password">비밀번호</label>
        <input class="auth-input" type="password" id="password" name="password"
               autocomplete="current-password" autofocus required>

        <p class="auth-error" th:if="${error}" th:text="${error}"></p>

        <button class="btn btn--primary auth-submit" type="submit">들어가기</button>
    </form>
</main>

</body>
</html>
